<style>
/* Painel de memória */
.mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:1.5rem;}
.mem-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1rem 1.1rem;display:flex;flex-direction:column;gap:6px;}
.mem-card .mem-num{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1;font-family:'Manrope',sans-serif;}
.mem-card .mem-lbl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;}
.mem-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
@media(max-width:700px){.mem-grid{grid-template-columns:repeat(2,1fr);}}

/* Cards de conteúdo */
.sec-title{font-size:14px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:1.75rem 0 .9rem;}
.cont-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.1rem 1.25rem;margin-bottom:10px;cursor:pointer;transition:border-color .18s,transform .18s;}
.cont-card:hover{border-color:rgba(198,154,58,.3);transform:translateY(-1px);}
.cont-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.cont-nome{font-size:15px;font-weight:600;}
.cont-meta{font-size:12px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.cont-status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;flex-shrink:0;}
.membar{height:6px;border-radius:4px;background:var(--surface2);overflow:hidden;margin-top:10px;}
.membar-fill{height:100%;border-radius:4px;transition:width .6s ease;}
.due-pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;}
.due-atrasada{background:rgba(226,75,74,.12);color:var(--red);}
.due-hoje{background:rgba(239,159,39,.14);color:var(--amber);}

/* Cards grandes de matéria */
.materia-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-bottom:1.5rem;}
.materia-card{
  position:relative;overflow:hidden;cursor:pointer;
  min-height:180px;padding:1.5rem;border-radius:22px;
  background:linear-gradient(150deg,color-mix(in srgb,var(--mc) 18%,var(--surface)),var(--surface) 70%);
  border:1px solid color-mix(in srgb,var(--mc) 30%,transparent);
  display:flex;flex-direction:column;
  transition:transform .22s cubic-bezier(.2,.8,.3,1),box-shadow .22s,border-color .22s;
}
.materia-card::before{
  content:'';position:absolute;top:-60px;right:-60px;width:180px;height:180px;border-radius:50%;
  background:var(--mc);opacity:.16;filter:blur(34px);transition:opacity .25s;pointer-events:none;
}
.materia-card:hover{transform:translateY(-4px);border-color:var(--mc);box-shadow:0 16px 40px -12px color-mix(in srgb,var(--mc) 45%,transparent);}
.materia-card:hover::before{opacity:.3;}
.materia-card:active{transform:translateY(-1px);}
.materia-top{display:flex;align-items:center;gap:9px;position:relative;}
.materia-bolinha{width:11px;height:11px;border-radius:50%;background:var(--mc);box-shadow:0 0 10px var(--mc);flex-shrink:0;}
.materia-nome{font-size:17px;font-weight:600;letter-spacing:-.2px;}
.materia-num{font-family:'Manrope',sans-serif;font-size:44px;font-weight:800;line-height:1;letter-spacing:-2px;color:var(--mc);margin-top:auto;}
.materia-num.zero{color:var(--muted);opacity:.45;}
.materia-sub{font-size:13px;color:var(--muted);margin-top:4px;}
.materia-foot{font-size:12px;color:var(--muted);opacity:.75;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.materia-seta{position:absolute;right:0;top:0;color:var(--mc);opacity:.5;transition:transform .2s,opacity .2s;}
.materia-card:hover .materia-seta{transform:translateX(3px);opacity:1;}

/* Cabeçalho da matéria aberta */
.mat-header{display:flex;align-items:center;gap:12px;margin-bottom:1.25rem;flex-wrap:wrap;}
.btn-voltar{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:9px 16px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .18s;}
.btn-voltar:hover{border-color:var(--border-hover);transform:translateX(-2px);}
.mat-header-nome{font-size:22px;font-weight:700;letter-spacing:-.4px;display:flex;align-items:center;gap:10px;}

/* Alternador Matérias / Todos */
.view-toggle{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:3px;gap:3px;}
.view-btn{background:none;border:none;color:var(--muted);border-radius:9px;padding:7px 16px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .18s;}
.view-btn.on{background:rgba(198,154,58,.14);color:var(--blue);}
.view-btn:hover:not(.on){color:var(--text);}

@media(max-width:520px){
  .materia-grid{grid-template-columns:1fr;gap:12px;}
  .materia-card{min-height:150px;padding:1.25rem;}
  .materia-num{font-size:38px;}
}

/* Estrelas de importância */
.star-row{display:flex;gap:6px;margin-top:4px;}
.star-btn{background:none;border:none;cursor:pointer;padding:2px;color:var(--muted);transition:color .15s,transform .15s;}
.star-btn:hover{transform:scale(1.15);}
.star-btn.on{color:#F5C462;}

/* Botões de avaliação da revisão */
.rate-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;}
.rate-btn{border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:14px 10px;cursor:pointer;text-align:center;transition:all .15s;font-family:inherit;color:var(--text);}
.rate-btn:hover{transform:translateY(-2px);}
.rate-btn .rate-t{font-size:14px;font-weight:600;}
.rate-btn .rate-s{font-size:11px;color:var(--muted);margin-top:3px;}
.rate-0:hover{border-color:var(--red);background:rgba(226,75,74,.08);}
.rate-1:hover{border-color:var(--amber);background:rgba(239,159,39,.08);}
.rate-2:hover{border-color:#1D9E75;background:rgba(29,158,117,.08);}
.rate-3:hover{border-color:#378ADD;background:rgba(55,138,221,.08);}

/* Abas do detalhe */
.det-tabs{display:flex;gap:6px;margin:1rem 0 .75rem;flex-wrap:wrap;}
.det-tab{border:1px solid var(--border);background:none;color:var(--muted);border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer;font-family:inherit;transition:all .15s;}
.det-tab.on{background:rgba(198,154,58,.12);color:var(--blue);border-color:rgba(198,154,58,.3);}
.det-body{font-size:14px;line-height:1.7;color:var(--text);white-space:pre-wrap;min-height:60px;}
.det-empty{color:var(--muted);font-style:italic;}
.hist-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.hist-row:last-child{border-bottom:none;}
.modal-textarea{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;resize:vertical;min-height:70px;line-height:1.6;}
.modal-textarea:focus{outline:none;border-color:rgba(198,154,58,.5);}
.imp-label{font-size:12px;color:var(--muted);}
select.modal-input{cursor:pointer;}
.next-preview{background:rgba(198,154,58,.08);border:1px solid rgba(198,154,58,.2);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--text);margin-top:12px;}

@media(max-width:480px){
  .rate-grid{grid-template-columns:1fr;}
  .cont-top{flex-direction:column;gap:6px;}
}
</style>
</head>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

const FC={apiKey:"AIzaSyCy5sqb9OTa9AL6X3RfbFsnMXx90hiqpPs",authDomain:"brainzept.firebaseapp.com",projectId:"brainzept",storageBucket:"brainzept.firebasestorage.app",messagingSenderId:"187802304063",appId:"1:187802304063:web:00f06e412f1bfa89e7828a"};
const app=initializeApp(FC);initializeAppCheck(app,{provider:new ReCaptchaV3Provider('6Ldx9zwtAAAAAHo-bQtNHqh9pxGZGetqUcEGHqHD'),isTokenAutoRefreshEnabled:true});const auth=getAuth(app),db=getFirestore(app);
let cu,subjects=[],conteudos=[];

/* ───── Helpers de data (fuso local, sem drift UTC) ───── */
function localDay(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function todayStr(){return localDay(new Date());}
function addDays(dstr,n){const d=new Date(dstr+'T00:00:00');d.setDate(d.getDate()+n);return localDay(d);}
function diffDays(aStr,bStr){return Math.round((new Date(aStr+'T00:00:00')-new Date(bStr+'T00:00:00'))/(1000*60*60*24));}
function fmtBr(dstr){if(!dstr)return'';return new Date(dstr+'T00:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ───── MOTOR DE REVISÃO (SM-2 adaptado, conservador) ───── */
const EASE_MIN=1.3,EASE_MAX=2.3,EASE_DEFAULT=1.7;
// q: 0 muito difícil · 1 difícil · 2 bom · 3 muito fácil
function computeReview(item,q){
  let ease=(typeof item.ease==='number')?item.ease:EASE_DEFAULT;
  let interval=(typeof item.interval==='number')?item.interval:1;
  let reps=item.reps||0;
  ease=Math.max(EASE_MIN,Math.min(EASE_MAX,ease+[-0.30,-0.15,0.05,0.15][q]));
  let ni;
  if(q===0){ni=Math.max(1,Math.round(interval*0.4));reps=0;}// esqueceu: recua (gradual), volta a aprender
  else if(reps===0){ni=[0,2,4,7][q];reps=1;}// 1ª revisão bem-sucedida: valores base
  else{
    const mult=q===1?1.2:(q===2?Math.min(ease,2.0):Math.min(ease+0.5,2.6));
    ni=Math.max(interval+1,Math.round(interval*mult));// cresce, mas nunca menos que +1 dia
    reps=reps+1;
  }
  ni=Math.min(ni,365);
  return{ease:Math.round(ease*100)/100,interval:ni,reps};
}
function memoryLevel(item){
  const reps=item.reps||0;
  const ease=(typeof item.ease==='number')?item.ease:EASE_DEFAULT;
  const lastQ=(item.history&&item.history.length)?item.history[item.history.length-1].q:null;
  let score=0;
  score+=Math.min(reps,6)/6*40;
  score+=(ease-EASE_MIN)/(EASE_MAX-EASE_MIN)*30;
  score+=(lastQ==null?0:[0,8,22,30][lastQ]);
  return Math.max(0,Math.min(100,Math.round(score)));
}
function statusOf(item){
  const ml=memoryLevel(item);
  const t=todayStr();
  const nr=item.nextReview||t;
  const reps=item.reps||0;
  if(nr<t)return{key:'risco',label:'Em risco',color:'#E24B4A'};       // revisão atrasada
  if(reps===0)return{key:'atencao',label:'Atenção',color:'#EF9F27'};  // novo, ainda aprendendo
  if(ml<45)return{key:'risco',label:'Em risco',color:'#E24B4A'};      // memória fraca comprovada
  if(nr===t||ml<65)return{key:'atencao',label:'Atenção',color:'#EF9F27'};
  if(ml<85)return{key:'estavel',label:'Estável',color:'#1D9E75'};
  return{key:'consolidado',label:'Consolidado',color:'#378ADD'};
}

function render(){

/* Prioridade: atrasadas primeiro, depois vencendo antes, e em empate a importância maior.
   É o que faz "os mais necessários" ficarem no topo. */
function prioridade(c){
  const t=todayStr();
  const nr=c.nextReview||t;
  const atraso=diffDays(t,nr);// >0 = atrasada há X dias
  return -(atraso*10+(c.importancia||1));
}
function sortPrioridade(list){return [...list].sort((a,b)=>prioridade(a)-prioridade(b));}
function visiveis(){return materiaFiltro?conteudos.filter(c=>(c.materia||'Sem matéria')===materiaFiltro):conteudos;}
/* Cor da matéria: usa a cor cadastrada em Matérias (dashboard); se não achar, deriva do nome */
const PALETA=['#C69A3A','#1D9E75','#378ADD','#B5559E','#E24B4A','#EF9F27','#7C5CFC','#0E9AA7'];
function corMateria(nome){
  const n=String(nome||'').trim().toLowerCase();
  const s=subjects.find(x=>String(x.name||'').trim().toLowerCase()===n);
  if(s&&s.color)return s.color;
  let h=0;for(let i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))>>>0;
  return PALETA[h%PALETA.length];
}
function agrupaPorMateria(list){
  const by={};
  list.forEach(c=>{const m=c.materia||'Sem matéria';(by[m]=by[m]||[]).push(c);});
  return by;
}
let _materiaNomes=[];// índice usado pelos cliques (evita interpolar o nome no onclick, que quebraria com aspas)
function renderMaterias(){
  const wrap=document.getElementById('materias-wrap');
  if(!conteudos.length){wrap.innerHTML='';return;}
  const t=todayStr();

  // Dentro de uma matéria: cabeçalho com voltar
  if(materiaFiltro!==null){
    const cor=corMateria(materiaFiltro);
    wrap.innerHTML=`<div class="mat-header">
      <button class="btn-voltar" onclick="voltarMaterias()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>Matérias</button>
      <div class="mat-header-nome"><span class="materia-bolinha" style="--mc:${cor}"></span>${esc(materiaFiltro)}</div>
    </div>`;
    return;
  }

  const toggle=`<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:1rem;">
    <div class="sec-title" style="margin:0;">${viewTodos?'Todos os conteúdos':'Matérias'}</div>
    <div class="view-toggle">
      <button class="view-btn${viewTodos?'':' on'}" onclick="setView(false)">Matérias</button>
      <button class="view-btn${viewTodos?' on':''}" onclick="setView(true)">Lista de todos</button>
    </div>
  </div>`;

  if(viewTodos){wrap.innerHTML=toggle;return;}

  const byMat=agrupaPorMateria(conteudos);
  _materiaNomes=Object.keys(byMat).sort();
  const cards=_materiaNomes.map((m,i)=>{
    const list=byMat[m];
    const due=list.filter(c=>(c.nextReview||t)<=t).length;
    const cor=corMateria(m);
    return`<div class="materia-card" style="--mc:${cor}" onclick="abrirMateria(${i})">
      <div class="materia-top">
        <span class="materia-bolinha"></span>
        <span class="materia-nome">${esc(m)}</span>
        <span class="materia-seta"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg></span>
      </div>
      <div class="materia-num${due?'':' zero'}">${due}</div>
      <div class="materia-sub">${due?`para revisar${due===1?'':''}`:'nada pendente'}</div>
      <div class="materia-foot">${list.length} conteúdo${list.length===1?'':'s'} no total</div>
    </div>`;
  }).join('');
  wrap.innerHTML=toggle+`<div class="materia-grid">${cards}</div>`;
}
window.abrirMateria=(i)=>{materiaFiltro=_materiaNomes[i];render();window.scrollTo({top:0,behavior:'smooth'});};
window.voltarMaterias=()=>{materiaFiltro=null;render();window.scrollTo({top:0,behavior:'smooth'});};
window.setView=(todos)=>{viewTodos=todos;materiaFiltro=null;render();};
function renderMemGrid(){
  // Só faz sentido dentro de uma matéria ou na lista de todos — na grade de cards os números já estão nos cards
  const mostrar=(materiaFiltro!==null||viewTodos)&&conteudos.length>0;
  document.getElementById('mem-section').style.display=mostrar?'':'none';
  if(!mostrar)return;
  document.getElementById('mem-title').textContent=materiaFiltro!==null?`Memória · ${materiaFiltro}`:'Sua memória hoje';
  const counts={risco:0,atencao:0,estavel:0,consolidado:0};
  visiveis().forEach(c=>{counts[statusOf(c).key]++;});// dentro de uma matéria, mostra só ela
  const defs=[
    {k:'risco',lbl:'Em risco',color:'#E24B4A'},
    {k:'atencao',lbl:'Atenção',color:'#EF9F27'},
    {k:'estavel',lbl:'Estável',color:'#1D9E75'},
    {k:'consolidado',lbl:'Consolidado',color:'#378ADD'},
  ];
  document.getElementById('mem-grid').innerHTML=defs.map(d=>`<div class="mem-card"><div class="mem-num" style="color:${d.color};">${counts[d.k]}</div><div class="mem-lbl"><span class="mem-dot" style="background:${d.color};"></span>${d.lbl}</div></div>`).join('');
}
function renderHoje(){
  const wrap=document.getElementById('hoje-wrap');
  // Na grade de cards os números já aparecem nos próprios cards de matéria
  if(materiaFiltro===null){wrap.innerHTML='';return;}
  const t=todayStr();
  const due=sortPrioridade(visiveis().filter(c=>(c.nextReview||t)<=t));
  if(!due.length){
    wrap.innerHTML=`<div class="sec-title" style="margin-top:0;">Para revisar</div><div class="cont-card" style="cursor:default;text-align:center;color:var(--muted);">Nada pendente nesta matéria.</div>`;
    return;
  }
  wrap.innerHTML=`<div class="sec-title" style="margin-top:0;">Para revisar · ${due.length}</div>`+due.map(c=>cardHtml(c,true)).join('');
}
function renderTodos(){
  const wrap=document.getElementById('todos-wrap');
  if(!conteudos.length){
    wrap.innerHTML=`<div class="sec-title">Conteúdos</div><div class="cont-card" style="cursor:default;text-align:center;color:var(--muted);padding:2.5rem 1rem;">Nenhum conteúdo cadastrado ainda.<br>Adicione o primeiro com "+ Novo conteúdo".</div>`;
    return;
  }
  const t=todayStr();
  // Dentro de uma matéria: o que não está pendente vem depois
  if(materiaFiltro!==null){
    const resto=sortPrioridade(visiveis().filter(c=>(c.nextReview||t)>t));
    wrap.innerHTML=resto.length?`<div class="sec-title">Outros conteúdos · ${resto.length}</div>`+resto.map(c=>cardHtml(c,false)).join(''):'';
    return;
  }
  // Lista de todos: lista única, mais necessários no topo
  if(viewTodos){
    wrap.innerHTML=sortPrioridade(conteudos).map(c=>cardHtml(c,(c.nextReview||t)<=t)).join('');
    return;
  }
  wrap.innerHTML='';// grade de cards: nada abaixo
}
function cardHtml(c,showDue){
  const st=statusOf(c);
  const ml=memoryLevel(c);
  const t=todayStr();
  const nr=c.nextReview||t;
  let duePill='';
  if(nr<t)duePill=`<span class="due-pill due-atrasada">atrasada ${Math.abs(diffDays(nr,t))}d</span>`;
  else if(nr===t)duePill=`<span class="due-pill due-hoje">hoje</span>`;
  const nextInfo=nr<=t?'':`próxima ${fmtBr(nr)}`;
  // Fora de uma matéria aberta, mostra de qual matéria é o conteúdo
  const matLabel=(materiaFiltro===null)?`<span style="display:inline-flex;align-items:center;gap:5px;"><span class="materia-bolinha" style="--mc:${corMateria(c.materia)};width:8px;height:8px;box-shadow:none;"></span>${esc(c.materia||'Sem matéria')}</span>`:'';
  return`<div class="cont-card" onclick="openDetalhe('${c.id}')">
    <div class="cont-top">
      <div style="min-width:0;">
        <div class="cont-nome">${esc(c.titulo)}</div>
        <div class="cont-meta">${matLabel}<span style="color:#F5C462;">${'★'.repeat(c.importancia||1)}</span>${duePill}${nextInfo?`<span>${nextInfo}</span>`:''}</div>
      </div>
      <span class="cont-status" style="background:${st.color}1f;color:${st.color};"><span class="mem-dot" style="background:${st.color};"></span>${st.label}</span>
    </div>
    <div class="membar"><div class="membar-fill" style="width:${ml}%;background:${st.color};"></div></div>
    ${showDue?`<button class="btn-primary" style="width:100%;margin-top:12px;" onclick="event.stopPropagation();openRevisao('${c.id}')">Revisar agora</button>`:''}
  </div>`;
}

window.saveConteudo=async()=>{
  const materia=document.getElementById('c-materia').value.trim();
  const titulo=document.getElementById('c-titulo').value.trim();
  const studiedAt=document.getElementById('c-data').value||todayStr();

  const base={
    materia:materia||'Sem matéria',titulo,

    studiedAt,
    subconteudos:document.getElementById('c-subconteudos').value,
    anotacoes:document.getElementById('c-anotacoes').value,

async function deleteConteudo(id){
  bzConfirm('Excluir conteúdo','Isso apaga o conteúdo e todo o histórico de revisões dele. Não pode ser desfeito.','danger',async()=>{
    try{
      await deleteDoc(doc(db,`users/${cu.uid}/revisoes`,id));
      conteudos=conteudos.filter(x=>x.id!==id);
      closeDetalhe();render();
    }catch(e){bzAlert('Erro ao excluir',(e.code||e.message||'desconhecido'),'danger');}
  });
}

/* ───── Revisão ───── */
window.openRevisao=(id)=>{
  revisandoId=id;
  const c=conteudos.find(x=>x.id===id);if(!c)return;
  document.getElementById('rev-titulo').textContent=c.titulo;
  document.getElementById('rev-materia').textContent=c.materia||'';
  document.getElementById('rev-reveal-wrap').style.display='';
  document.getElementById('rev-conteudo').style.display='none';
  document.getElementById('rev-conteudo').innerHTML='';
  document.getElementById('rev-rate').style.display='none';
  document.getElementById('rev-manual-dias').value='';
  document.getElementById('modal-revisao').classList.add('open');
};
window.revealConteudo=()=>{
  const c=conteudos.find(x=>x.id===revisandoId);if(!c)return;
  const parts=[];
  if(c.subconteudos&&c.subconteudos.trim())parts.push(`<div style="margin-bottom:8px;"><div class="imp-label">Subconteúdos</div><div class="det-body">${esc(c.subconteudos)}</div></div>`);
  if(c.anotacoes&&c.anotacoes.trim())parts.push(`<div style="margin-bottom:8px;"><div class="imp-label">Anotações</div><div class="det-body">${esc(c.anotacoes)}</div></div>`);
  document.getElementById('rev-conteudo').innerHTML=parts.length?parts.join(''):`<div class="det-empty" style="padding:8px 0;">Sem conteúdo salvo — avalie pela memória.</div>`;
  document.getElementById('rev-conteudo').style.display='';
  document.getElementById('rev-reveal-wrap').style.display='none';
  document.getElementById('rev-rate').style.display='';
};
async function persistReview(c,interval,q){
  const ease=q!=null?computeReview(c,q).ease:c.ease;
  const reps=q!=null?computeReview(c,q).reps:(c.reps||0);
  const nextReview=addDays(todayStr(),interval);
  const history=(c.history||[]).concat([{date:todayStr(),q:q==null?2:q,intervalAfter:interval}]);
  const patch={ease,reps,interval,nextReview,history};
  const backup={ease:c.ease,reps:c.reps,interval:c.interval,nextReview:c.nextReview,history:c.history};
  Object.assign(c,patch);
  try{
    await updateDoc(doc(db,`users/${cu.uid}/revisoes`,c.id),patch);
    closeRevisao();render();
    showToastMsg(`Próxima revisão em ${interval} dia${interval===1?'':'s'} · ${fmtBr(nextReview)}`);
  }catch(e){Object.assign(c,backup);bzAlert('Erro ao salvar revisão',(e.code||e.message||'desconhecido'),'danger');}
}
window.applyReview=(q)=>{
  const c=conteudos.find(x=>x.id===revisandoId);if(!c)return;
  const r=computeReview(c,q);
  persistReview(c,r.interval,q);
};
window.applyManual=()=>{
  const c=conteudos.find(x=>x.id===revisandoId);if(!c)return;
  const dias=parseInt(document.getElementById('rev-manual-dias').value);
  if(!dias||dias<1||dias>365){bzAlert('Valor inválido','Digite um número de dias entre 1 e 365.','warn');return;}
  persistReview(c,dias,null);
};
window.closeRevisao=()=>document.getElementById('modal-revisao').classList.remove('open');

function showToastMsg(msg){
  let t=document.getElementById('rev-toast');
  if(!t){t=document.createElement('div');t.id='rev-toast';t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);color:var(--text);padding:12px 20px;border-radius:12px;font-size:14px;z-index:99999;box-shadow:0 8px 30px rgba(0,0,0,.4);transition:opacity .3s;';document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';
  clearTimeout(window._revToastT);window._revToastT=setTimeout(()=>{t.style.opacity='0';},3000);
}

/* ───── Perfil / conta / PWA ───── */
window.openProfileModal=()=>{const name=document.getElementById('user-name-el').textContent;document.getElementById('profile-name-inp').value=name;const big=document.getElementById('profile-avatar-big');const initials=name.trim().split(/\s+/).filter(Boolean).map(n=>n[0]).join('').toUpperCase().slice(0,2);big.innerHTML=window._profilePhoto?`<img src="${window._profilePhoto}" style="width:100%;height:100%;object-fit:cover;">`:`<span style="font-size:28px;font-weight:700;">${initials}</span>`;document.getElementById('modal-profile').classList.add('open');};
window.closeProfileModal=()=>document.getElementById('modal-profile').classList.remove('open');
window.handlePhoto=(input)=>{const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas');const max=200;const r=Math.min(max/img.width,max/img.height,1);canvas.width=Math.round(img.width*r);canvas.height=Math.round(img.height*r);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);window._profilePhoto=canvas.toDataURL('image/jpeg',.75);document.getElementById('profile-avatar-big').innerHTML=`<img src="${window._profilePhoto}" style="width:100%;height:100%;object-fit:cover;">`;setAvatar(document.getElementById('user-name-el').textContent,window._profilePhoto);};img.src=e.target.result;};reader.readAsDataURL(file);};
window.saveProfile=async()=>{const name=document.getElementById('profile-name-inp').value.trim();if(!name)return;try{await setDoc(doc(db,`users/${cu.uid}/data`,'profile'),{name,photo:window._profilePhoto||null},{merge:true});setAvatar(name,window._profilePhoto);closeProfileModal();}catch(e){bzAlert('Erro ao salvar perfil',(e.code||e.message||'desconhecido'),'danger');}};
window.doLogout=async()=>{closeProfileModal();const{signOut}=await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js");await signOut(auth);window.location.href='https://focadus.com.br/';};
let _deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();_deferredPrompt=e;const b=document.getElementById('install-btn');if(b)b.style.display='flex';});
window.installPWA=async()=>{if(!_deferredPrompt)return;_deferredPrompt.prompt();const{outcome}=await _deferredPrompt.userChoice;if(outcome==='accepted')_deferredPrompt=null;};
</script>
</body>
